version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      all-dependencies:
        patterns:
          - '*'
    assignees:
      - 'jluszcz'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      all-actions:
        patterns:
          - '*'
    assignees:
      - 'jluszcz'
  - package-ecosystem: 'pre-commit'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      all-pre-commit:
        patterns:
          - '*'
    assignees:
      - 'jluszcz'
