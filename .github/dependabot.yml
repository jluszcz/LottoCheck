version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      all-dependencies:
        patterns:
          - '*'
    # @cloudflare/vitest-pool-workers pins vitest's major as a peer, so a
    # vitest major bump breaks `npm ci` until the pool supports it. Move both
    # together by hand.
    ignore:
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
    assignees:
      - 'jluszcz'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      all-actions:
        patterns:
          - '*'
    assignees:
      - 'jluszcz'
  - package-ecosystem: 'pre-commit'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      all-pre-commit:
        patterns:
          - '*'
    assignees:
      - 'jluszcz'
